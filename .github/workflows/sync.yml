name: Hardy Calendar Sync

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Ustaw Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Zainstaluj zależności
        run: npm install

      - name: Generuj plik ICS
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: node index.js

      - name: Zapisz hardy.ics do repozytorium
        run: |
          git config user.name  "Hardy Sync Bot"
          git config user.email "actions@github.com"
          git add hardy.ics
          git diff --staged --quiet || git commit -m "chore: aktualizacja planu $(date +'%Y-%m-%d')"
          git push
