name: Hardy Calendar Sync

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Zainstaluj zaleznosci
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generuj plik ICS
        run: node index.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Konfiguruj Git
        run: git config user.name "Hardy Sync Bot" && git config user.email "actions@github.com"

      - name: Commituj zmiany
        run: git add hardy.ics && git diff --staged --quiet || git commit -m "aktualizacja planu"

      - name: Wypchnij zmiany
        run: git push
