name: Hardy Calendar Sync

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generuj plik ICS
        run: node index.js

      - name: Zapisz hardy.ics do repozytorium
        run: |
          git config user.name  "Hardy Sync Bot"
          git config user.email "actions@github.com"
          git add hardy.ics
          git diff --staged --quiet || git commit -m "chore: aktualizacja planu $(date +'%Y-%m-%d')"
          git push
