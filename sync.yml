name: Hardy Calendar Sync

on:
  schedule:
    # Co drugi dzień o 8:00 czasu polskiego (6:00 UTC)
    - cron: "0 6 */2 * *"

  # Możliwość ręcznego uruchomienia z panelu GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Zainstaluj zależności
        run: npm ci

      - name: Generuj plik ICS
        run: node index.js 2>&1 | tee sync_output.txt

      - name: Zapisz hardy.ics do repozytorium
        run: |
          git config user.name  "Hardy Sync Bot"
          git config user.email "actions@github.com"
          git add hardy.ics
          git diff --staged --quiet || git commit -m "chore: aktualizacja planu $(date +'%Y-%m-%d')"
          git push

      - name: Wyślij e-mail z raportem
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          to: rozniaste9@gmail.com
          from: Hardy Sync <${{ secrets.MAIL_USERNAME }}>
          subject: "🏋️ Hardy Sync – ${{ job.status == 'success' && 'OK' || 'BŁĄD' }}"
          body: |
            Synchronizacja planu treningowego Hardy: ${{ job.status }}
            Data: ${{ github.run_started_at }}

            Subskrypcja kalendarza (nie zmienia się):
            https://raw.githubusercontent.com/${{ github.repository }}/main/hardy.ics
          attachments: sync_output.txt
